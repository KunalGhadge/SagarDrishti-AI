<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Ocean Badge -->
  <rect width="64" height="64" rx="16" fill="url(#oceanGrad)" />
  
  <!-- Radar Rings -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="3,3" />
  <circle cx="32" cy="32" r="14" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" />
  
  <!-- Dynamic Ocean Wave Crests -->
  <path d="M14 42 C 20 36, 26 46, 32 40 C 38 34, 44 44, 50 38" fill="none" stroke="url(#waveGrad)" stroke-width="3.5" stroke-linecap="round" />
  <path d="M18 48 C 23 44, 27 50, 32 46 C 37 42, 41 48, 46 44" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.75" />
  
  <!-- Maritime Star / Compass Beacon -->
  <polygon points="32,12 35,24 47,27 35,30 32,42 29,30 17,27 29,24" fill="#ffffff" />
  <circle cx="32" cy="27" r="3" fill="#38bdf8" />
</svg>
